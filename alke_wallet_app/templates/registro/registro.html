{%load static%}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{%static 'global/css/global.css' %}" />
    <link rel="stylesheet" href="{%static 'login/css/style.css'%}" />
  </head>

  <body>
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="col-lg-6">
        <div class="card shadow cardStyle">
          <div id="inicio" class="card-header text-center formTitle">
            <h3 class="mb-0 fw-bold">Registro de usuario</h3>
          </div>
          <div class="card-body">
            {{ form.non_field_errors }}
            <form method="POST">
              {% csrf_token %}

              <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label"
                  >Usuario</label
                >
                {{ form.username }} {{ form.username.errors }}
              </div>

              <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label"
                  >Email address</label
                >
                {{ form.email }} {{ form.email.errors }}
              </div>

              <div class="mb-3">
                <label
                  for="{{ form.password1.id_for_label }}"
                  class="form-label"
                  >Password</label
                >
                {{ form.password1 }} {{ form.password1.errors }}
              </div>

              <div class="mb-3">
                <label
                  for="{{ form.password2.id_for_label }}"
                  class="form-label"
                  >Confirm Password</label
                >
                {{ form.password2 }} {{ form.password2.errors }}
              </div>
              <div class="separatorLine"></div>
              <button type="submit" class="btn buttonGreen w-100">
                Crear cuenta
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
